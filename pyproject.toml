[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "global-football-value-predictor"
version = "0.1.0"
description = "Global Football Transfer Market Valuation Engine - Stage 1"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antigravity Engineering" }
]
dependencies = [
    "streamlit>=1.35.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn==1.7.2",
    "pyarrow>=12.0.0",
    "joblib==1.5.2",
    "requests>=2.28.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
